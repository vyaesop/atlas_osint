apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-backend
  namespace: atlas
  labels: { app: atlas-backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: atlas-backend }
  template:
    metadata:
      labels: { app: atlas-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/atlas-backend:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: atlas-config }
            - secretRef: { name: atlas-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-backend
  namespace: atlas
spec:
  selector: { app: atlas-backend }
  ports:
    - port: 80
      targetPort: 8000
---
# Scale the API horizontally on CPU. The graph-analytics endpoints are CPU-bound,
# so this is the primary lever (paired with the Redis cache) toward the
# 10M-node / 100M-relationship target.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-backend
  namespace: atlas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
